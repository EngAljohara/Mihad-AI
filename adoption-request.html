<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب احتضان - مهاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #fffaf4;
      color: #492108;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    h2 {
      color: #e65a3a;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #8b4a24;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .child-info {
      background: #fff3e2;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border-right: 4px solid #e65a3a;
    }

    .child-info h3 {
      color: #492108;
      margin-bottom: 10px;
    }

    .child-info p {
      margin: 5px 0;
      color: #492108;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #492108;
    }

    .form-group label .required {
      color: #e65a3a;
      margin-right: 3px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #e65a3a;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .submit-btn {
      background: #e65a3a;
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .submit-btn:hover {
      background: #c94b2f;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .success-message {
      display: none;
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #c3e6cb;
      text-align: center;
    }

    .error-message {
      display: none;
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #f5c6cb;
      text-align: center;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      background: #fffaf4;
      border-top: 1px solid #f1d3b8;
      color: #492108;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .container {
        margin: 20px;
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <!-- الهيدر -->
  <div id="header"></div>

  <!-- المحتوى -->
  <div class="container">
    <h2>طلب احتضان طفل</h2>
    <p class="subtitle">يرجى تعبئة النموذج بدقة لمراجعة الطلب</p>

    <!-- معلومات الطفل -->
    <div class="child-info" id="childInfo">
      <h3>معلومات الطفل المطلوب</h3>
      <p><strong>الاسم:</strong> <span id="childName">-</span></p>
      <p><strong>العمر:</strong> <span id="childAge">-</span> سنة</p>
      <p><strong>الجنس:</strong> <span id="childGender">-</span></p>
      <p><strong>نسبة التطابق:</strong> <span id="childSimilarity">-</span>%</p>
    </div>

    <!-- رسائل النجاح والخطأ -->
    <div class="success-message" id="successMsg">
      تم إرسال طلبك بنجاح! سيتم مراجعته قريباً.
    </div>

    <div class="error-message" id="errorMsg">
      حدث خطأ في إرسال الطلب. يرجى المحاولة مرة أخرى.
    </div>

    <!-- نموذج الطلب -->
    <form id="adoptionForm">
      <h3 style="color: #492108; margin-bottom: 15px;">بيانات الوالدين</h3>

      <div class="form-row">
        <div class="form-group">
          <label>
            <span class="required">*</span>
            اسم الأب الكامل
          </label>
          <input type="text" id="fatherName" required placeholder="أدخل اسم الأب">
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            اسم الأم الكامل
          </label>
          <input type="text" id="motherName" required placeholder="أدخل اسم الأم">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>
            <span class="required">*</span>
            رقم الهاتف
          </label>
          <input type="tel" id="phoneNumber" required placeholder="05xxxxxxxx" pattern="[0-9]{10}">
        </div>

        <div class="form-group">
          <label>
            <span class="required">*</span>
            البريد الإلكتروني
          </label>
          <input type="email" id="email" required placeholder="example@email.com">
        </div>
      </div>

      <div class="form-group">
        <label>
          <span class="required">*</span>
          العنوان السكني
        </label>
        <input type="text" id="address" required placeholder="المدينة، الحي">
      </div>

      <div class="form-group">
        <label>
          <span class="required">*</span>
          الحالة الاجتماعية
        </label>
        <select id="maritalStatus" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Tajawal';">
          <option value="">اختر الحالة</option>
          <option value="متزوج">متزوج</option>
          <option value="أرمل">أرمل</option>
          <option value="مطلق">مطلق</option>
        </select>
      </div>

      <div class="form-group">
        <label>
          ملاحظات إضافية (اختياري)
        </label>
        <textarea id="notes" placeholder="أي معلومات إضافية تود إضافتها..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        إرسال الطلب
      </button>
    </form>
  </div>

  <!-- الفوتر -->
  <div id="footer"></div>

  <!-- تحميل الهيدر -->
  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        const scripts = document.getElementById("header").querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <!-- تحميل الفوتر -->
  <script>
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        const footerContainer = document.getElementById("footer");
        footerContainer.innerHTML = data;
        const scriptTags = footerContainer.querySelectorAll("script");
        scriptTags.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // تحميل بيانات الطفل من URL
    const urlParams = new URLSearchParams(window.location.search);
    const childName = urlParams.get('name') || '-';
    const childAge = urlParams.get('age') || '-';
    const childGender = urlParams.get('gender') || '-';
    const childSimilarity = urlParams.get('similarity') || '-';

    // عرض بيانات الطفل
    document.getElementById('childName').textContent = childName;
    document.getElementById('childAge').textContent = childAge;
    document.getElementById('childGender').textContent = childGender;
    document.getElementById('childSimilarity').textContent = childSimilarity;

    // معالجة إرسال النموذج
    document.getElementById('adoptionForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');

      // إخفاء الرسائل
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      // تعطيل الزر
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';

      // جمع البيانات
      const requestData = {
        // بيانات الطفل
        childName,
        childAge,
        childGender,
        similarity: childSimilarity,
        
        // بيانات الوالدين
        fatherName: document.getElementById('fatherName').value.trim(),
        motherName: document.getElementById('motherName').value.trim(),
        phoneNumber: document.getElementById('phoneNumber').value.trim(),
        email: document.getElementById('email').value.trim(),
        address: document.getElementById('address').value.trim(),
        maritalStatus: document.getElementById('maritalStatus').value,
        notes: document.getElementById('notes').value.trim(),
        
        // بيانات إضافية
        status: 'pending',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      try {
        // حفظ في Firebase
        await push(ref(db, 'requests'), requestData);
        
        // إظهار رسالة النجاح
        successMsg.style.display = 'block';
        
        // مسح النموذج
        document.getElementById('adoptionForm').reset();
        
        // تمرير للأعلى لرؤية الرسالة
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // إعادة تفعيل الزر
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'إرسال الطلب';
        }, 2000);

        // توجيه لصفحة النتائج بعد 3 ثواني
        setTimeout(() => {
          window.location.href = 'result.html';
        }, 3000);

      } catch (error) {
        console.error('خطأ في إرسال الطلب:', error);
        
        // إظهار رسالة الخطأ
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'حدث خطأ: ' + error.message;
        
        // إعادة تفعيل الزر
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال الطلب';
        
        // تمرير للأعلى لرؤية الرسالة
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
