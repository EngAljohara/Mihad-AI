<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>الأطفال المسجلون - مهاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #fffaf4;
      color: #492108;
      margin: 0;
      padding: 0;
    }

    /* المحتوى */
    .children {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #e65a3a;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      transition: border 0.3s;
    }

    input:focus, select:focus {
      border-color: #e65a3a;
    }

    button {
      background: #e65a3a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 15px;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #c94b2f;
      transform: scale(1.03);
    }

    .kids-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .kid-card {
      background: #fffaf4;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .kid-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .kid-card img {
      width: 100%;
      border-radius: 10px;
      height: 150px;
      object-fit: cover;
    }

    .muted {
      color: #8b4a24;
      text-align: center;
      margin-top: 25px;
      font-size: 15px;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      background: #fffaf4;
      color: #492108;
      border-top: 1px solid #f1d3b8;
    }

    footer a {
      color: #e65a3a;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- الهيدر -->
  <div id="header"></div>

  <!-- المحتوى -->
  <div class="children">
    <h2>إضافة طفل جديد</h2>

    <label>اسم الطفل</label>
    <input type="text" id="childName" placeholder="اسم الطفل">

    <label>العمر (بالسنوات)</label>
    <input type="number" id="childAge" min="0" placeholder="العمر">

    <label>الجنس</label>
    <select id="childGender">
      <option value="">اختر الجنس</option>
      <option value="ذكر">ذكر</option>
      <option value="أنثى">أنثى</option>
    </select>

    <label>صورة الطفل</label>
    <input type="file" id="childPhoto" accept="image/*">

    <div style="text-align:center;">
      <button id="addBtn" type="button">إضافة الطفل</button>
    </div>

    <h2 style="margin-top:40px;">الأطفال المضافون</h2>
    <div id="kidsList" class="kids-list"></div>

    <p class="muted" id="emptyMsg" style="display:none;">لم تتم إضافة أي طفل بعد.</p>
  </div>

  <!-- الفوتر -->
  <div id="footer"></div>

  <!-- تحميل الهيدر -->
  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        const scripts = document.getElementById("header").querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <!-- تحميل الفوتر -->
  <script>
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        const footerContainer = document.getElementById("footer");
        footerContainer.innerHTML = data;
        const scriptTags = footerContainer.querySelectorAll("script");
        scriptTags.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID",
      measurementId: "YOUR_MEASUREMENT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const addBtn = document.getElementById('addBtn');
    const listEl = document.getElementById('kidsList');
    const emptyMsg = document.getElementById('emptyMsg');

    addBtn.addEventListener('click', () => {
      const name = document.getElementById('childName').value.trim();
      const age = document.getElementById('childAge').value.trim();
      const gender = document.getElementById('childGender').value;
      const file = document.getElementById('childPhoto').files[0];

      if (!name || !age || !gender || !file) {
        alert('الرجاء إدخال جميع الحقول واختيار الصورة.');
        return;
      }

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        try {
          await push(ref(db, "children"), {
            name,
            age,
            gender,
            img: base64,
            addedAt: new Date().toISOString()
          });
          alert("تم إضافة الطفل بنجاح");
          document.getElementById('childName').value = '';
          document.getElementById('childAge').value = '';
          document.getElementById('childGender').value = '';
          document.getElementById('childPhoto').value = '';
        } catch (error) {
          alert('حدث خطأ: ' + error.message);
        }
      };
      reader.readAsDataURL(file);
    });

    onValue(ref(db, "children"), snapshot => {
      const data = snapshot.val();
      listEl.innerHTML = '';
      if (!data) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      Object.entries(data).forEach(([id, kid]) => {
        const div = document.createElement('div');
        div.className = 'kid-card';
        div.innerHTML = `
          <img src="${kid.img}" alt="${kid.name}">
          <div><strong>${kid.name}</strong><br>
          <small>العمر: ${kid.age}</small><br>
          <small>${kid.gender}</small><br>
          <button onclick="deleteKid('${id}')">حذف</button>
          </div>`;
        listEl.appendChild(div);
      });
    });

    window.deleteKid = async function(id) {
      if (confirm("هل تريد حذف هذا الطفل؟")) {
        try {
          await remove(ref(db, "children/" + id));
          alert("تم حذف الطفل");
        } catch (error) {
          alert('حدث خطأ: ' + error.message);
        }
      }
    };
  </script>
</body>
</html>
