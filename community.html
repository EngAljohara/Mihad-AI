<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المجتمع - مهاد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background-color: #fffaf4;
      color: #492108;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h1 {
      color: #e65a3a;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .page-header p {
      color: #8b4a24;
      font-size: 18px;
      line-height: 1.8;
    }

    /* نموذج التعليق */
    .comment-form {
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }

    .comment-form h3 {
      color: #e65a3a;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #492108;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #e65a3a;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      background: #e65a3a;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .submit-btn:hover {
      background: #c94b2f;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    /* قسم التعليقات */
    .comments-section {
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .comments-section h3 {
      color: #e65a3a;
      margin-bottom: 25px;
      font-size: 24px;
    }

    .comment-card {
      background: #fffaf4;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      border-right: 4px solid #e65a3a;
      transition: all 0.3s ease;
    }

    .comment-card:hover {
      transform: translateX(-5px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .comment-author {
      font-weight: 700;
      color: #492108;
      font-size: 18px;
    }

    .comment-date {
      color: #8b4a24;
      font-size: 14px;
    }

    .comment-text {
      color: #492108;
      line-height: 1.8;
      font-size: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8b4a24;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      margin-top: 40px;
      background: #fffaf4;
      border-top: 1px solid #f1d3b8;
      font-size: 14px;
      color: #492108;
    }
  </style>
</head>

<body>
  <!-- الهيدر -->
  <div id="header"></div>

  <!-- المحتوى -->
  <div class="container">
    <div class="page-header">
      <h1>مجتمع مهاد</h1>
      <p>شارك تجربتك وآرائك مع المجتمع</p>
    </div>

    <!-- نموذج إضافة تعليق -->
    <div class="comment-form">
      <h3>شارك رأيك</h3>
      <form id="commentForm">
        <div class="form-group">
          <label>الاسم</label>
          <input type="text" id="authorName" required placeholder="اسمك الكامل">
        </div>

        <div class="form-group">
          <label>التعليق</label>
          <textarea id="commentText" required placeholder="شاركنا رأيك أو تجربتك..."></textarea>
        </div>

        <button type="submit" class="submit-btn">نشر التعليق</button>
      </form>
    </div>

    <!-- قسم التعليقات -->
    <div class="comments-section">
      <h3>آراء المجتمع</h3>
      <div id="commentsList">
        <div class="empty-state">
          <p>جاري تحميل التعليقات...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- الفوتر -->
  <div id="footer"></div>

  <!-- تحميل الهيدر -->
  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;
        const script = document.getElementById("header").querySelector("script");
        if (script) eval(script.textContent);
      });
  </script>

  <!-- تحميل الفوتر -->
  <script>
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        const footerContainer = document.getElementById("footer");
        footerContainer.innerHTML = data;
        const scriptTags = footerContainer.querySelectorAll("script");
        scriptTags.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // تحميل التعليقات
    function loadComments() {
      const commentsListEl = document.getElementById('commentsList');
      
      onValue(ref(db, "comments"), (snapshot) => {
        const data = snapshot.val();
        
        if (!data) {
          commentsListEl.innerHTML = `
            <div class="empty-state">
              <p>لا توجد تعليقات حتى الآن. كن أول من يشارك!</p>
            </div>
          `;
          return;
        }

        const comments = Object.entries(data)
          .map(([id, comment]) => ({ id, ...comment }))
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        commentsListEl.innerHTML = comments.map(comment => `
          <div class="comment-card">
            <div class="comment-header">
              <span class="comment-author">${comment.author}</span>
              <span class="comment-date">${new Date(comment.createdAt).toLocaleDateString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })}</span>
            </div>
            <p class="comment-text">${comment.text}</p>
          </div>
        `).join('');
      });
    }

    // إضافة تعليق جديد
    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const author = document.getElementById('authorName').value.trim();
      const text = document.getElementById('commentText').value.trim();
      
      if (!author || !text) {
        alert('الرجاء إدخال جميع الحقول');
        return;
      }

      try {
        await push(ref(db, "comments"), {
          author,
          text,
          createdAt: new Date().toISOString()
        });
        
        alert('تم نشر تعليقك بنجاح');
        document.getElementById('commentForm').reset();
      } catch (error) {
        alert('حدث خطأ: ' + error.message);
      }
    });

    // إضافة تعليقات وهمية عند أول تشغيل
    const sampleComments = [
      {
        author: "أم سارة",
        text: "تجربة رائعة مع مهاد، النظام سهل ومرتب جداً. شكراً لكم على هذا المجهود الرائع.",
        createdAt: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
      },
      {
        author: "محمد العتيبي",
        text: "المنصة ساعدتنا كثيراً في عملية الاحتضان. التقنية المستخدمة مبتكرة ومفيدة.",
        createdAt: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString()
      },
      {
        author: "فاطمة أحمد",
        text: "نظام المطابقة الذكي فكرة عبقرية. شكراً على تسهيل هذه العملية الإنسانية.",
        createdAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()
      },
      {
        author: "أبو عبدالله",
        text: "بارك الله فيكم على هذا العمل النبيل. منصة احترافية ومدروسة بعناية.",
        createdAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
      },
      {
        author: "نورة السالم",
        text: "استخدمت المنصة وكانت التجربة سلسة جداً. أنصح الجميع بها.",
        createdAt: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000).toISOString()
      }
    ];

    // تحميل التعليقات
    loadComments();
  </script>
</body>
</html>
